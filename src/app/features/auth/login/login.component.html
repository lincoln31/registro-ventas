<div class="auth-container">
  <div class="auth-card">
    <h2>Iniciar Sesión</h2>
    <p style="text-align: center; color: #666; margin-bottom: 1.5rem;">Sistema de Registro de Ventas</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email:</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email"
          [class.error]="form.get('email')?.invalid && form.get('email')?.touched"
        >
        <div class="error-message" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Ingrese un email válido
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password"
          [class.error]="form.get('password')?.invalid && form.get('password')?.touched"
        >
        <div class="error-message" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          La contraseña es requerida
        </div>
      </div>

      <button 
        type="submit" 
        [disabled]="form.invalid || loading()"
        class="btn-primary"
        style="margin-bottom: 1rem;"
      >
        {{ loading() ? 'Iniciando...' : 'Iniciar Sesión' }}
      </button>

      <button 
        type="button"
        (click)="loginWithGoogle()"
        [disabled]="loading()"
        class="btn-primary"
        style="background-color: #dc3545; margin-bottom: 1rem;"
      >
        {{ loading() ? 'Conectando...' : 'Continuar con Google' }}
      </button>
    </form>

    <div class="auth-links">
      <p>¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
    </div>
  </div>
</div>
