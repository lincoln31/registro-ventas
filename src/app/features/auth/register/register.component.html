<div class="auth-container">
  <div class="auth-card">
    <h2>Registro</h2>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email:</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email"
          [class.error]="form.get('email')?.invalid && form.get('email')?.touched"
        >
        <div class="error-message" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Email es requerido y debe ser válido
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password"
          [class.error]="form.get('password')?.invalid && form.get('password')?.touched"
        >
        <div class="error-message" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          Contraseña es requerida (mínimo 6 caracteres)
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña:</label>
        <input 
          type="password" 
          id="confirmPassword" 
          formControlName="confirmPassword"
          [class.error]="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched"
        >
      </div>

      <button 
        type="submit" 
        [disabled]="form.invalid || loading()"
        class="btn-primary"
      >
        {{ loading() ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <div class="auth-links">
      <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
