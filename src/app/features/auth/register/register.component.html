<!-- Contenedor principal centrado -->
<div class="auth-container d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-card fade-in-up">

    <!-- Encabezado con icono y título -->
    <div class="text-center mb-4">
      <div class="mb-3">
        <i class="bi bi-person-plus text-gradient" style="font-size: 3rem;"></i>
      </div>
      <h2 class="fw-bold">Crear Cuenta</h2>
      <p class="subtitle">Únete al sistema de registro de ventas</p>
    </div>
    
    <!-- Formulario de registro -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Campo de email -->
      <div class="form-floating mb-3">
        <input 
          type="email" 
          class="form-control" 
          id="email" 
          placeholder="nombre@ejemplo.com"
          formControlName="email"
          [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
        >
        <label for="email">
          <i class="bi bi-envelope me-2"></i>Correo electrónico
        </label>
        <!-- Error si el email no es válido -->
        <div class="invalid-feedback" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          <i class="bi bi-exclamation-circle me-1"></i>
          Email es requerido y debe ser válido
        </div>
      </div>

      <!-- Campo de contraseña -->
      <div class="form-floating mb-3">
        <input 
          type="password" 
          class="form-control" 
          id="password" 
          placeholder="Contraseña"
          formControlName="password"
          [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
        >
        <label for="password">
          <i class="bi bi-lock me-2"></i>Contraseña
        </label>
        <!-- Error si no cumple la validación -->
        <div class="invalid-feedback" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          <i class="bi bi-exclamation-circle me-1"></i>
          Contraseña es requerida (mínimo 6 caracteres)
        </div>
      </div>

      <!-- Confirmar contraseña -->
      <div class="form-floating mb-4">
        <input 
          type="password" 
          class="form-control" 
          id="confirmPassword" 
          placeholder="Confirmar contraseña"
          formControlName="confirmPassword"
          [class.is-invalid]="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched"
        >
        <label for="confirmPassword">
          <i class="bi bi-shield-check me-2"></i>Confirmar Contraseña
        </label>
        <!-- Error si no coincide o está vacío -->
        <div class="invalid-feedback" *ngIf="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched">
          <i class="bi bi-exclamation-circle me-1"></i>
          Confirma tu contraseña
        </div>
      </div>

      <!-- Botón principal de registro -->
      <div class="d-grid">
        <button 
          type="submit" 
          [disabled]="form.invalid || loading()"
          class="btn btn-primary btn-lg"
        >
          <!-- Muestra spinner mientras carga -->
          <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!loading()" class="bi bi-person-check me-2"></i>
          {{ loading() ? 'Creando cuenta...' : 'Crear Cuenta' }}
        </button>
      </div>
    </form>

    <!-- Enlace para ir al login si ya tiene cuenta -->
    <div class="auth-links">
      <p class="mb-0">¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
    </div>
  </div>
</div>
